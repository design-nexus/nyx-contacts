[package]
name = "nyx-contacts"
version = "0.1.0"
description = "A local address book for the Nyx Suite"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "52cba5e27a3dd5f00c780f53e423302b4b5f9c9c" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "d6400bb7d1940dcc2ab86bb86c4ef410db3b4ff4" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "d6400bb7d1940dcc2ab86bb86c4ef410db3b4ff4" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
csv = "1"

nyx-pim = { git = "https://github.com/design-nexus/nyx-core.git", rev = "1fa444e8c427f8d2f4b6fd6d1ace1c5298e4d623" }

nyx-accounts-native = { package = "nyx-accounts-service", git = "https://github.com/design-nexus/nyx-accounts.git", rev = "ecbe31cbfe6688dd5b3d7803c58e433715427c57" }
