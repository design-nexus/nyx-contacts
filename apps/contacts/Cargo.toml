[package]
name = "nyx-contacts"
version = "0.1.0"
description = "A local address book for the Nyx Suite"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "52cba5e27a3dd5f00c780f53e423302b4b5f9c9c" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "d6400bb7d1940dcc2ab86bb86c4ef410db3b4ff4" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "d6400bb7d1940dcc2ab86bb86c4ef410db3b4ff4" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
csv = "1"

nyx-pim = { git = "https://github.com/design-nexus/nyx-core.git", rev = "f972d4e21f087721c1e5b5af25acc85cf9df5e9c" }

nyx-accounts-native = { package = "nyx-accounts-service", git = "https://github.com/design-nexus/nyx-accounts.git", rev = "5a0ed8fbe022a6953aba856979478716669fa3f1" }
